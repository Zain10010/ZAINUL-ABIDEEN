<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E294B" />
      <stop offset="50%" stop-color="#101218" />
      <stop offset="100%" stop-color="#08090D" />
    </radialGradient>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6285FF" />
      <stop offset="50%" stop-color="#8CA6FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="url(#bgGlow)" />

  <!-- Grid overlay -->
  <g opacity="0.15">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800 M0 600 H800 M0 700 H800 M0 800 H800" stroke="#6285FF" stroke-width="1" />
    <path d="M100 0 V900 M200 0 V900 M300 0 V900 M400 0 V900 M500 0 V900 M600 0 V900 M700 0 V900" stroke="#6285FF" stroke-width="1" />
  </g>

  <!-- Ambient light ring -->
  <circle cx="400" cy="400" r="220" fill="none" stroke="url(#electricGrad)" stroke-width="2" stroke-dasharray="10 15" opacity="0.5" />
  <circle cx="400" cy="400" r="200" fill="#151820" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Silhouette / Monogram Avatar Placeholder -->
  <!-- Shoulders -->
  <path d="M260 560 Q400 500 540 560 L570 650 Q400 680 230 650 Z" fill="#1C2130" opacity="0.9" />
  <!-- Head silhouette -->
  <circle cx="400" cy="370" r="85" fill="#242B40" />

  <!-- Monogram Overlay -->
  <g transform="translate(400, 370)">
    <circle cx="0" cy="0" r="60" fill="#151820" stroke="url(#electricGrad)" stroke-width="3" filter="url(#glow)" />
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="54" font-weight="800" fill="url(#electricGrad)" text-anchor="middle">Z</text>
  </g>

  <!-- Label badge -->
  <g transform="translate(400, 720)">
    <rect x="-170" y="-24" width="340" height="48" rx="24" fill="#101218" stroke="url(#electricGrad)" stroke-width="1.5" />
    <text x="0" y="6" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#F5F5F5" text-anchor="middle" letter-spacing="1">
      PHOTO PLACEHOLDER
    </text>
  </g>

  <text x="400" y="785" font-family="'Inter', sans-serif" font-size="14" fill="#A1A1AA" text-anchor="middle">
    Drop your photo at: <tspan fill="#6285FF">public/images/zain-profile.jpg</tspan>
  </text>
  <text x="400" y="810" font-family="'Inter', sans-serif" font-size="12" fill="#71717A" text-anchor="middle">
    High-resolution portrait recommended (JPEG / PNG)
  </text>
</svg>

